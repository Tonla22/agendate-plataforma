<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendate</title>
<style>
:root {
  --bg: #0D0D0D; --bg2: #1A1A1A; --bg3: #222;
  --oro: #C9A84C; --texto: #F5F0E8; --texto2: #9A9185;
  --borde: rgba(201,168,76,0.18); --borde2: rgba(255,255,255,0.08);
  --verde: #27AE60; --rojo: #C0392B; --azul: #2980B9;
}
body.panel-theme-light {
  --bg: #F4F1EA;
  --bg2: #FFFFFF;
  --bg3: #F8F6F1;
  --oro: #9B7A22;
  --texto: #181511;
  --texto2: #6C6259;
  --texto-acento: #FFFFFF;
  --borde: rgba(20,18,16,0.12);
  --borde2: rgba(20,18,16,0.10);
}

body.panel-theme-light .com-sidebar,
body.panel-theme-light .admin-sidebar,
body.panel-theme-light .com-mobile-bar {
  background: rgba(255,255,255,0.97);
  border-color: rgba(20,18,16,0.10);
}

body.panel-theme-light .com-main,
body.panel-theme-light #panel-comercio,
body.panel-theme-light #panel-admin {
  background: #F4F1EA;
  color: #181511;
}

body.panel-theme-light .com-user-mini,
body.panel-theme-light .panel-soft-card,
body.panel-theme-light .card,
body.panel-theme-light .modal,
body.panel-theme-light .table-wrap,
body.panel-theme-light .perfil-panel-card {
  background: #FFFFFF;
  border-color: rgba(20,18,16,0.10);
  box-shadow: 0 12px 30px rgba(24,21,17,0.04);
}

body.panel-theme-light .input {
  background: #FFFFFF;
  color: #181511;
  border-color: rgba(20,18,16,0.16);
}

body.panel-theme-light .input:focus {
  border-color: var(--oro);
}

body.panel-theme-light .tabla tr:hover td {
  background: rgba(20,18,16,0.035);
}

body.panel-theme-light .btn-ghost {
  color: #5F554C;
  border-color: rgba(20,18,16,0.16);
}

body.panel-theme-light .btn-ghost:hover {
  color: var(--oro);
  border-color: var(--oro);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--texto); font-family: -apple-system,'Segoe UI',sans-serif; }
a { color: var(--oro); text-decoration: none; }
button { cursor: pointer; font-family: inherit; }
input,select,textarea { font-family: inherit; }

/* ---- LAYOUTS ---- */
#app { min-height: 100vh; }
.page {
  display: none !important;
}

#pagina-comercio.page.activa {
  display: block !important;
}

#pagina-login.page.activa {
  display: flex !important;
}

#panel-admin.page.activa {
  display: grid !important;
}

#panel-comercio.page.activa {
  display: grid !important;
}

/* ---- COMPONENTES BASE ---- */
.btn { padding: 0.6rem 1.2rem; border-radius: 3px; font-size: 0.85rem; font-weight: 600; letter-spacing: 0.05em; border: none; transition: opacity 0.2s,transform 0.1s; }
.btn:hover { opacity: 0.88; }
.btn:active { transform: scale(0.98); }
.btn-oro { background: var(--oro); color: var(--texto-acento, #0D0D0D); }
.btn-ghost { background: transparent; border: 1px solid var(--borde2); color: var(--texto2); }
.btn-ghost:hover { border-color: var(--oro); color: var(--oro); opacity: 1; }
.btn-peligro { background: var(--rojo); color: #fff; }
.btn-sm { padding: 0.4rem 0.9rem; font-size: 0.78rem; }
.btn-full { width: 100%; }

.card { background: var(--bg2); border: 1px solid var(--borde2); border-radius: 4px; padding: 1.5rem; }
.badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 3px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em; }
.badge-verde { background: rgba(39,174,96,0.15); color: #2ecc71; }
.badge-rojo { background: rgba(192,57,43,0.15); color: #e74c3c; }
.badge-oro { background: rgba(201,168,76,0.15); color: var(--oro); }
.badge-gris { background: rgba(255,255,255,0.05); color: var(--texto2); }

.form-group { margin-bottom: 1.2rem; }
.label { display: block; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--texto2); margin-bottom: 0.4rem; }
.input { width: 100%; background: var(--bg3); border: 1px solid var(--borde2); color: var(--texto); padding: 0.7rem 0.9rem; border-radius: 3px; font-size: 0.9rem; outline: none; transition: border-color 0.2s; }
.input:focus { border-color: var(--oro); }
.input.err { border-color: var(--rojo); }
.input-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.form-error { color: var(--rojo); font-size: 0.78rem; margin-top: 0.25rem; }

.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:200; align-items:center; justify-content:center; padding:1rem; }
.modal-overlay.abierto { display:flex; }
.modal { background: var(--bg2); border: 1px solid var(--borde); border-radius: 6px; padding: 2rem; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; }
.modal h3 { margin-bottom: 1.5rem; color: var(--oro); }

.tabla {
  width: 100%;
  border-collapse: collapse;
  border-spacing: 0;
  font-size: 0.88rem;
}

.tabla th {
  text-align: left;
  padding: 0.7rem 1rem;
  color: var(--texto2);
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--borde2);
}

.tabla tbody tr {
  border-bottom: 1px solid var(--borde2);
}

.tabla tbody tr:last-child {
  border-bottom: none;
}

.tabla td {
  padding: 0.8rem 1rem;
  border-bottom: none;
  vertical-align: middle;
  height: 64px;
}

.tabla tr:hover td {
  background: rgba(255,255,255,0.02);
}

.toast { position: fixed; bottom: 2rem; right: 2rem; background: var(--bg3); border: 1px solid var(--borde); color: var(--texto); padding: 0.8rem 1.2rem; border-radius: 4px; font-size: 0.88rem; z-index: 9999; display: none; max-width: 320px; }
.toast.show { display: block; animation: fadeIn 0.25s; }
.toast.ok { border-color: var(--verde); }
.toast.error { border-color: var(--rojo); }
@keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; } }

.loader-inline { display:inline-block; width:14px; height:14px; border:2px solid rgba(13,13,13,0.3); border-top-color:#0D0D0D; border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle; margin-right:6px; }
.loader-inline.claro { border:2px solid rgba(201,168,76,0.2); border-top-color: var(--oro); }
@keyframes spin { to { transform: rotate(360deg); } }

/* ==================================================================
   PÁGINA PÚBLICA DE CADA COMERCIO
   ================================================================== */
#pagina-comercio { min-height:100vh; }

#pc-nav {
  position:fixed; top:0; width:100%; z-index:100;
  background:rgba(13,13,13,0.95); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--borde);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 2rem; height:60px;
}
.pc-logo { font-size:1.2rem; font-weight:700; letter-spacing:0.05em; }
.pc-nav-links { display:flex; gap:1.5rem; font-size:0.82rem; letter-spacing:0.06em; text-transform:uppercase; }
.pc-nav-links a { color:var(--texto2); transition:color 0.2s; }
.pc-nav-links a:hover { color:var(--oro); }

#pc-hero {
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  text-align:center; padding:80px 2rem 4rem;
  background: radial-gradient(ellipse at 30% 50%, rgba(201,168,76,0.05) 0%, transparent 55%), #0D0D0D;
  position:relative; overflow:hidden;
}
.pc-ornamento { font-size:0.7rem; letter-spacing:0.3em; text-transform:uppercase; color:var(--oro); margin-bottom:1.2rem; }
.pc-titulo { font-family:Georgia,serif; font-size:clamp(3rem,9vw,6.5rem); line-height:1; margin-bottom:0.8rem; }
.pc-slogan { color:var(--texto2); font-size:1rem; font-style:italic; font-family:Georgia,serif; margin:0 auto 2.5rem; max-width:760px; line-height:1.7; }
.pc-cta { display:flex; gap:0.75rem; justify-content:center; flex-wrap:wrap; }
.pc-divider { width:1px; height:50px; background:linear-gradient(to bottom,var(--oro),transparent); margin:2rem auto 0; }
.pc-brand { display:flex; align-items:center; gap:0.65rem; min-width:0; }
.pc-brand-img { width:42px; height:34px; object-fit:contain; border-radius:0; border:none; background:transparent; }
.pc-hero-logo { width:min(150px,38vw); height:92px; object-fit:contain; border-radius:0; border:none; margin:0 auto 1rem; background:transparent; }
.pc-float-wa {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 120;
  display: flex;
  align-items: center;
  gap: 0.55rem;
  background: #3f3f3f;
  color: #00e676;
  padding: 0.8rem 1.15rem;
  border-radius: 999px;
  font-weight: 800;
  font-size: 1rem;
  box-shadow: 0 14px 35px rgba(0,0,0,0.38);
  transition: opacity 0.2s, transform 0.2s;
}

.pc-float-wa:hover {
  opacity: 1;
  color: #00e676;
  transform: translateY(-2px);
}

.pc-float-wa.scrolling {
  opacity: 0.42;
}

.pc-float-wa svg {
  width: 25px;
  height: 25px;
  flex: 0 0 auto;
}

@media (max-width: 640px) {
  #pc-nav {
    height:56px;
    padding:0 0.85rem;
    background:rgba(5,5,5,0.72);
  }
  .pc-nav-links { display:none; }
  .pc-brand { gap:0.45rem; min-width:0; max-width:58%; }
  .pc-brand-img { width:32px; height:28px; flex:0 0 auto; }
  .pc-logo {
    font-size:0.95rem;
    line-height:1.1;
    white-space:normal;
    overflow:hidden;
  }
  #pc-nav .btn {
    padding:0.45rem 0.65rem;
    font-size:0.72rem;
    letter-spacing:0.03em;
    max-width:112px;
    line-height:1.15;
  }
  .pc-float-wa {
    right: 12px;
    bottom: 12px;
    padding: 0.7rem 0.95rem;
    font-size: 0.92rem;
  }
}
.pc-reserva-apartado { display:none; min-height:100vh; padding-top:88px !important; }
.pc-reserva-apartado.abierto { display:block; }
.pc-back-info { margin-bottom:1.25rem; }
.pc-ubicacion-actions { display:flex; gap:0.75rem; align-items:center; flex-wrap:wrap; margin-bottom:1.5rem; }

#pc-servicios { padding:5rem 2rem; }
.pc-sec-label { font-size:0.68rem; letter-spacing:0.3em; text-transform:uppercase; color:var(--oro); margin-bottom:0.6rem; }
.pc-sec-titulo { font-family:Georgia,serif; font-size:clamp(1.8rem,4vw,2.8rem); margin-bottom:0.5rem; }
.pc-linea { width:50px; height:2px; background:var(--oro); margin:1rem 0 2.5rem; }
.pc-servicios-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 300px));
  gap: 1rem;
  background: transparent;
  justify-content: start;
}

.pc-serv-card {
  background: var(--bg2);
  border: 1px solid var(--borde);
  border-left: 3px solid transparent;
  transition: border-color 0.2s, transform 0.2s;
  overflow: hidden;
  max-width: 300px;
}

.pc-serv-card:hover {
  border-left-color: var(--oro);
  transform: translateY(-2px);
}

.pc-serv-img {
  width: 100%;
  height: 170px;
  object-fit: cover;
  object-position: center;
  display: block;
  background: #111;
}
.pc-serv-body { padding:1.8rem; }
.pc-serv-nombre { font-size:1rem; margin-bottom:0.4rem; font-family:Georgia,serif; }
.pc-serv-precio { font-size:1.6rem; font-weight:700; color:var(--oro); }
.pc-serv-dur { font-size:0.75rem; color:var(--texto2); margin-top:0.3rem; }
.pc-serv-btn { margin-top:1rem; background:transparent; border:1px solid var(--borde2); color:var(--texto2); padding:0.45rem 0.9rem; font-size:0.78rem; letter-spacing:0.08em; text-transform:uppercase; border-radius:2px; width:100%; transition:all 0.2s; }
.pc-serv-btn:hover { border-color:var(--oro); color:var(--oro); }

#pc-horarios { padding:5rem 2rem; background:var(--bg2); }
.pc-horarios-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:0.75rem; }
.pc-hor-item { background:var(--bg3); padding:1rem 1.2rem; border:1px solid var(--borde2); border-radius:2px; }
.pc-hor-dia { font-size:0.85rem; color:var(--texto2); margin-bottom:0.4rem; font-weight:600; }
.pc-hor-hora { font-size:0.82rem; color:var(--oro); display:block; }
.pc-hor-cerrado { font-size:0.8rem; color:var(--texto2); opacity:0.4; font-style:italic; }
.pc-hor-bloque { font-size:0.82rem; color:var(--oro); display:block; }
.pc-hor-bloque+.pc-hor-bloque:before { content:''; display:block; height:3px; }
.pc-hor-descanso { font-size:0.72rem; color:var(--texto2); opacity:0.6; display:block; margin:2px 0; }

/* Hero con imagen de fondo */
#pc-hero.con-imagen { background:#0D0D0D; }
.pc-hero-bg {
  position:absolute; inset:-28px; background-size:cover; background-position:center top;
  filter:blur(22px); transform:scale(1.08); opacity:0.45;
}
.pc-hero-img {
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center top;
  opacity:0.82;
}
#pc-hero.con-imagen::before {
  content:''; position:absolute; inset:0; z-index:1;
  background:linear-gradient(to bottom,rgba(0,0,0,0.45),rgba(0,0,0,0.68)), rgba(0,0,0,0.18);
}
.pc-hero-content { position:relative; z-index:2; max-width:980px; margin:0 auto; }

@media (max-width: 640px) {
  #pc-hero.con-imagen {
    min-height:100svh;
    align-items:center;
    padding:76px 1.1rem 2rem;
  }
  #pc-hero.con-imagen .pc-hero-img {
    inset:0;
    height:100%;
    object-fit:cover;
    object-position:center top;
    opacity:0.92;
  }
  #pc-hero.con-imagen .pc-hero-bg {
    opacity:0.55;
    background-position:center top;
  }
  #pc-hero.con-imagen::before {
    background:linear-gradient(to bottom,rgba(0,0,0,0.22) 0%,rgba(0,0,0,0.22) 36%,rgba(0,0,0,0.55) 62%,rgba(0,0,0,0.78) 100%);
  }
  .pc-hero-content {
    align-self:center;
    margin-top:10vh;
  }
  .pc-hero-logo {
    width:min(120px,34vw);
    height:82px;
    margin-bottom:0.75rem;
  }
  .pc-titulo {
    font-size:clamp(2.6rem,14vw,4.2rem);
    line-height:0.95;
  }
  .pc-slogan {
    font-size:0.95rem;
    line-height:1.55;
    margin-bottom:1.35rem;
    color:#fff;
    text-shadow:0 2px 12px rgba(0,0,0,0.75);
  }
}

/* Upload de imagen en panel */
.img-upload-area { border:2px dashed var(--borde2); border-radius:4px; padding:1.2rem; text-align:center; cursor:pointer; transition:border-color 0.2s; margin-bottom:0.5rem; }
.img-upload-area:hover { border-color:var(--oro); }
.img-upload-area input[type=file] { display:none; }
.img-preview { width:100%; max-height:160px; object-fit:cover; border-radius:3px; margin-top:0.5rem; display:none; }
.img-preview.visible { display:block; }
.img-preview-logo { width:140px; height:140px; max-height:none; object-fit:contain; padding:0.6rem; background:#111; border:1px solid var(--borde2); }
.img-preview-fondo { height:220px; max-height:none; object-fit:cover; object-position:center top; }
.img-url-actual { font-size:0.72rem; color:var(--texto2); margin-top:0.3rem; word-break:break-all; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }

.perfil-layout {
  display: grid;
  grid-template-columns: minmax(0, 560px) minmax(280px, 420px);
  gap: 1.5rem;
  align-items: start;
}

.perfil-ayuda {
  display: block;
  color: var(--texto2);
  font-size: 0.72rem;
  line-height: 1.45;
  margin-top: 0.35rem;
}

.perfil-preview {
  background: var(--bg2);
  border: 1px solid var(--borde2);
  border-radius: 4px;
  overflow: hidden;
  position: sticky;
  top: 1rem;
}

.perfil-preview-head {
  padding: 1rem;
  border-bottom: 1px solid var(--borde2);
}

.perfil-preview-head strong {
  display: block;
  color: var(--oro);
  margin-bottom: 0.25rem;
}

.perfil-preview-hero {
  min-height: 220px;
  background: linear-gradient(135deg, #111, #252525);
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: end;
  padding: 1rem;
  position: relative;
}

.perfil-preview-hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.78), rgba(0,0,0,0.18));
}

.perfil-preview-content {
  position: relative;
  z-index: 1;
}

.perfil-preview-logo {
  width: 64px;
  height: 64px;
  object-fit: contain;
  background: rgba(0,0,0,0.25);
  border-radius: 4px;
  margin-bottom: 0.75rem;
}

.perfil-preview-title {
  font-family: Georgia, serif;
  font-size: 1.65rem;
  line-height: 1.05;
  margin-bottom: 0.45rem;
}

.perfil-preview-slogan {
  color: rgba(255,255,255,0.82);
  font-size: 0.86rem;
  line-height: 1.45;
  margin-bottom: 0.9rem;
}

.perfil-preview-btn {
  display: inline-block;
  padding: 0.55rem 0.9rem;
  border-radius: 3px;
  color: #0D0D0D;
  font-size: 0.78rem;
  font-weight: 700;
}

@media (max-width: 900px) {
  .perfil-layout {
    grid-template-columns: 1fr;
  }

  .perfil-preview {
    position: static;
  }
}

.perfil-preview {
  max-width: 420px;
  background: #111;
  border: 1px solid var(--borde2);
  border-radius: 6px;
  overflow: hidden;
}

.perfil-preview-head {
  padding: 0.85rem 1rem;
  background: rgba(255,255,255,0.03);
  border-bottom: 1px solid var(--borde2);
}

.perfil-preview-hero {
  min-height: 430px;
  background-color: #111;
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.4rem;
  text-align: center;
}

.perfil-preview-hero::before {
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.25),
    rgba(0,0,0,0.62),
    rgba(0,0,0,0.82)
  );
}

.perfil-preview-content {
  max-width: 330px;
}

.perfil-preview-logo {
  width: 86px;
  height: 86px;
  margin: 0 auto 1rem;
  object-fit: contain;
  background: rgba(255,255,255,0.92);
  border-radius: 6px;
  padding: 0.35rem;
}

.perfil-preview-title {
  font-size: 2rem;
  color: #fff;
  margin-bottom: 0.65rem;
  text-shadow: 0 2px 14px rgba(0,0,0,0.8);
}

.perfil-preview-slogan {
  color: rgba(255,255,255,0.9);
  font-size: 0.9rem;
  line-height: 1.55;
  margin-bottom: 1.2rem;
  text-shadow: 0 2px 12px rgba(0,0,0,0.8);
}

.perfil-preview-btn {
  display: inline-block;
  padding: 0.7rem 1.3rem;
  border-radius: 4px;
  color: #0D0D0D;
  font-size: 0.82rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}

/* Horarios con bloques */
.hor-dia-row { display:flex; align-items:flex-start; gap:0.75rem; padding:0.8rem 0; border-bottom:1px solid var(--borde2); flex-wrap:wrap; }
.hor-dia-row:last-child { border-bottom:none; }
.hor-dia-nombre { min-width:90px; font-size:0.88rem; padding-top:0.5rem; }
.hor-bloques-container { flex:1; min-width:200px; }
.hor-bloque-row { display:flex; align-items:center; gap:0.5rem; margin-bottom:0.4rem; }
.hor-bloque-row .input { padding:0.4rem 0.5rem; width:auto; min-width:85px; }
.btn-add-bloque { background:transparent; border:1px dashed var(--borde2); color:var(--texto2); padding:0.3rem 0.7rem; font-size:0.75rem; border-radius:2px; cursor:pointer; transition:all 0.15s; }
.btn-add-bloque:hover { border-color:var(--oro); color:var(--oro); }
.btn-rm-bloque { background:transparent; border:none; color:var(--texto2); padding:0.2rem 0.4rem; cursor:pointer; font-size:1.1rem; line-height:1; transition:color 0.15s; }
.btn-rm-bloque:hover { color:var(--rojo); }

/* RESERVA STEPS */
#pc-reservas { padding:5rem 2rem; }
.reserva-box { max-width:640px; margin:0 auto; }
.steps-bar { display:flex; align-items:center; margin-bottom:2.5rem; font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase; }
.step-item { display:flex; align-items:center; gap:0.4rem; flex:1; }

.cal-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:0.8rem; }
.cal-mes-txt { font-size:0.95rem; }
.cal-btn { background:none; border:1px solid var(--borde2); color:var(--texto); width:30px; height:30px; border-radius:2px; font-size:1rem; transition:border-color 0.2s; }
.cal-btn:hover { border-color:var(--oro); color:var(--oro); }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
.cal-dn { text-align:center; font-size:0.65rem; color:var(--texto2); padding:0.4rem 0; letter-spacing:0.04em; text-transform:uppercase; }

.cal-d.disp:hover { border-color:var(--oro); color:var(--oro); }
.cal-d.sel { background:var(--oro); color:#0D0D0D; font-weight:700; }
.cal-d.pas { color:var(--texto2); opacity:0.25; }
.cal-d.cer { color:var(--texto2); opacity:0.2; text-decoration:line-through; }
.cal-d.hoy { border-color:rgba(201,168,76,0.35); }

.horas-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(82px,1fr)); gap:0.4rem; margin-top:1.2rem; }
.hora-b { padding:0.55rem; text-align:center; border:1px solid var(--borde2); border-radius:2px; font-size:0.82rem; cursor:pointer; background:var(--bg3); color:var(--texto); transition:all 0.12s; }
.hora-b:hover { border-color:var(--oro); color:var(--oro); }
.hora-b.sel { background:var(--oro); color:#0D0D0D; font-weight:700; border-color:var(--oro); }

.resumen-card { background:var(--bg3); border:1px solid var(--borde); border-radius:3px; padding:1.2rem; margin-bottom:1.5rem; }
.res-fila { display:flex; justify-content:space-between; padding:0.4rem 0; border-bottom:1px solid var(--borde2); font-size:0.88rem; }
.res-fila:last-child { border-bottom:none; }
.res-k { color:var(--texto2); }
.res-v { font-weight:500; }
.res-total .res-k { color:var(--texto); font-weight:700; }
.res-total .res-v { color:var(--oro); font-size:1.1rem; font-weight:700; }

.pasos-nav { display:flex; gap:0.75rem; justify-content:space-between; margin-top:1.5rem; }
.btn-atras { background:transparent; border:1px solid var(--borde2); color:var(--texto2); padding:0.7rem 1.2rem; border-radius:2px; font-size:0.82rem; transition:all 0.2s; }
.btn-atras:hover { border-color:var(--texto2); color:var(--texto); }
.btn-sig { background:var(--oro); color:#0D0D0D; border:none; padding:0.7rem 1.8rem; border-radius:2px; font-size:0.82rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; flex:1; max-width:260px; transition:opacity 0.2s; }
.btn-sig:hover { opacity:0.87; }
.btn-sig:disabled { opacity:0.28; cursor:not-allowed; }

.pc-confirmacion { text-align:center; padding:3rem 1rem; }
.pc-check { width:72px; height:72px; background:rgba(39,174,96,0.12); border:2px solid var(--verde); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.8rem; margin:0 auto 1.5rem; }
.pc-conf-detalle { background:var(--bg3); border:1px solid var(--borde); border-radius:3px; padding:1.2rem; margin:1.5rem auto; max-width:380px; text-align:left; }

/* ==================================================================

#panel-admin { min-height:100vh; display:grid; grid-template-columns:220px 1fr; }
.admin-sidebar { background:var(--bg2); border-right:1px solid var(--borde2); padding:0; display:flex; flex-direction:column; }
.admin-sidebar-logo { padding:1.5rem 1.2rem; border-bottom:1px solid var(--borde2); font-size:1.1rem; font-weight:700; color:var(--oro); }

.admin-nav { flex:1; padding:1rem 0; }
.admin-nav a { display:flex; align-items:center; gap:0.6rem; padding:0.7rem 1.2rem; color:var(--texto2); font-size:0.85rem; transition:all 0.15s; border-left:3px solid transparent; }
.admin-nav a:hover,.admin-nav a.act { color:var(--texto); background:rgba(255,255,255,0.04); border-left-color:var(--oro); }

.stat-card { background:var(--bg2); border:1px solid var(--borde2); border-radius:4px; padding:1.2rem; }
.stat-num { font-size:2rem; font-weight:700; color:var(--oro); }

.metric-card {

  min-height: 132px;

  flex-direction: column;
  justify-content: space-between;
  gap: 0.8rem;
}
.metric-card::after {
  content: "";
  position: absolute;
  right: -34px;
  top: -34px;

  height: 112px;
  border-radius: 50%;

}
.metric-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;

}
.metric-icon {
  width: 42px;
  height: 42px;
  border-radius: 10px;

  border: 1px solid var(--metric-border, rgba(201,168,76,0.20));
  flex: 0 0 auto;
}
.metric-icon svg {
  width: 21px;
  height: 21px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.metric-note {
  color: var(--texto2);
  font-size: 0.76rem;
  line-height: 1.35;

  z-index: 1;
}
.admin-secciones {

}
.admin-sec { display:none; }
.admin-sec.act { display:block; }
.table-wrap { overflow-x:auto; background:var(--bg2); border:1px solid var(--borde2); border-radius:4px; }

<div id="app">

</div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
// ESTADO GLOBAL
// ============================================================
const S = {
  token: localStorage.getItem('token'),
  tipo: localStorage.getItem('tipo'),       // 'admin' | 'comercio'
  slug: localStorage.getItem('slug'),
  nombre: localStorage.getItem('nombre'),
  comercio: null,     // datos del comercio público actual
  reserva: {},        // reserva en curso
  calMes: new Date().getMonth(),
  calAnio: new Date().getFullYear(),
  paso: 1,
};

const API = '/api';
const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DIAS_FULL = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function aplicarTemaPanel(tema = localStorage.getItem('panelTema') || 'oscuro') {
  const claro = tema === 'claro';
  document.body.classList.toggle('panel-theme-light', claro);
  localStorage.setItem('panelTema', claro ? 'claro' : 'oscuro');
  document.querySelectorAll('[data-panel-theme]').forEach(btn => {
    btn.classList.toggle('act', btn.dataset.panelTheme === (claro ? 'claro' : 'oscuro'));
  });
}

aplicarTemaPanel();

// ============================================================
// ROUTING
// ============================================================
function route() {
    window.scrollTo(0, 0);
  document.documentElement.scrollTop = 0;
  document.body.scrollTop = 0;

  const path = location.pathname.replace(/\/$/, '');
  const parts = path.split('/').filter(Boolean);

if (parts[0] === 'cancelar' && parts[1]) {
  cargarCancelacionPublica(parts[1]);
  return;
}

  const tokenGuardado = localStorage.getItem('token');
const tipoGuardado = localStorage.getItem('tipo');

if (path === '/panel') {
  if (!tokenGuardado || tipoGuardado !== 'comercio') {
    reemplazarRuta('/login');
    return;
  }
}

if (path === '/admin') {
  if (!tokenGuardado || tipoGuardado !== 'admin') {
    reemplazarRuta('/admin-acceso');
    return;
  }
}

  document.querySelectorAll('.page').forEach(p => p.classList.remove('activa'));

  if (parts.length === 0 || path === '/') {
    // Home → si logueado ir al panel, si no login
    if (S.token && S.tipo) return irPanel();
    mostrarLogin();
  } else if (parts[0] === 'admin') {
    mostrarAdmin();
  } else if (parts[0] === 'panel') {
    mostrarPanelComercio();
    } else if (parts[0] === 'login') {
    if (tokenGuardado && tipoGuardado === 'comercio') {
      reemplazarRuta('/panel');
      return;
    }
    mostrarLogin('comercio');
  } else if (parts[0] === 'admin-acceso') {
    if (tokenGuardado && tipoGuardado === 'admin') {
      reemplazarRuta('/admin');
      return;
    }
    mostrarLogin('admin');
  } else {
    // Es un slug de comercio
    cargarComercioPublico(parts[0]);
  }
}

function navegar(path) {
  history.pushState({}, '', path);
  route();
  setTimeout(() => window.scrollTo(0, 0), 0);
}

function reemplazarRuta(path) {
  history.replaceState({}, '', path);
  route();
  setTimeout(() => window.scrollTo(0, 0), 0);
}
window.addEventListener('popstate', route);

// ============================================================
// API HELPER
// ============================================================
async function api(method, endpoint, body) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json', ...(S.token ? { Authorization: 'Bearer ' + S.token } : {}) }
  };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + endpoint, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    const detalles = Array.isArray(data.detalles) && data.detalles.length
      ? ': ' + data.detalles.join(', ')
      : '';
    throw new Error((data.error || 'Error del servidor') + detalles);
  }
  return data;
}
async function apiUpload(endpoint, file, extra = {}) {
  const form = new FormData();
  form.append('imagen', file);
  Object.entries(extra).forEach(([key, value]) => form.append(key, value));

  const r = await fetch(API + endpoint, {
    method: 'POST',
    headers: {
      ...(S.token ? { Authorization: 'Bearer ' + S.token } : {})
    },
    body: form
  });

  const data = await r.json().catch(() => ({}));

  if (!r.ok) {
    const detalles = Array.isArray(data.detalles) && data.detalles.length
      ? ': ' + data.detalles.join(', ')
      : '';
    throw new Error((data.error || 'No se pudo subir la imagen') + detalles);
  }

  return data;
}

function previewArchivoImagen(input, previewId) {
  const img = document.getElementById(previewId);

  if (!img || !input.files || !input.files[0]) return;

  const file = input.files[0];

  if (!file.type.startsWith('image/')) {
    toast('Elegí un archivo de imagen', 'error');
    input.value = '';
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    toast('La imagen no puede superar 5 MB', 'error');
    input.value = '';
    return;
  }

  img.src = URL.createObjectURL(file);
  img.classList.add('visible');
}

  const form = new FormData();
  form.append('imagen', file);
  Object.entries(extra).forEach(([key, value]) => form.append(key, value));

  const r = await fetch(API + endpoint, {
    method: 'POST',
    headers: {
      ...(S.token ? { Authorization: 'Bearer ' + S.token } : {})
    },
    body: form
  });

  const data = await r.json().catch(() => ({}));

  if (!r.ok) {
    const detalles = Array.isArray(data.detalles) && data.detalles.length
      ? ': ' + data.detalles.join(', ')
      : '';
    throw new Error((data.error || 'No se pudo subir la imagen') + detalles);
  }

  return data;
}

function previewArchivoImagen(input, previewId) {
  const img = document.getElementById(previewId);

  if (!img || !input.files || !input.files[0]) return;

  const file = input.files[0];

  if (!file.type.startsWith('image/')) {
    toast('Elegí un archivo de imagen', 'error');
    input.value = '';
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    toast('La imagen no puede superar 5 MB', 'error');
    input.value = '';
    return;
  }

  img.classList.add('visible');
}

function toast(msg, tipo = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + tipo;
  setTimeout(() => el.className = 'toast', 3500);
}

function irPanel() {
  if (S.tipo === 'admin') {
    window.location.href = '/admin';
  } else if (S.tipo === 'comercio') {
    window.location.href = '/panel';
  }
}

// ============================================================
// LOGIN
// ============================================================
function mostrarLogin(tipo = 'comercio') {
  loginTipo = tipo;
  const esAdmin = tipo === 'admin';
  document.getElementById('pagina-login').classList.add('activa');
  document.getElementById('pagina-login').innerHTML = `
          <div class="login-box">
        <div class="login-logo">Agendate</div>
        <p class="login-sub">${esAdmin ? 'Acceso interno' : 'Acceso para comercios'}</p>
        <div class="card">
          <div style="margin-bottom:1.5rem;text-align:center">
            <strong style="color:var(--oro);font-size:1rem">${esAdmin ? 'Panel administrador' : 'Panel del comercio'}</strong>
            <p style="color:var(--texto2);font-size:0.8rem;margin-top:0.35rem">
              ${esAdmin ? 'Ingreso reservado para la administración de Agendate.' : 'Ingresá con los datos de tu comercio.'}
            </p>
          </div>
        <div id="login-form-area">
          <div class="form-group">
            <label class="label">Email</label>
            <input class="input" id="l-email" type="email" placeholder="admin@ejemplo.com" onkeydown="if(event.key==='Enter')doLogin()">
          </div>
          <div class="form-group">
            <label class="label">Contraseña</label>
            <input class="input" id="l-pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
          </div>
          <div id="l-error" class="form-error" style="margin-bottom:0.8rem"></div>
          <button class="btn btn-oro btn-full" onclick="doLogin()" id="btn-login">Ingresar</button>
        </div>
      </div>
    </div>`;
}

let loginTipo = 'comercio';
function loginTab(tipo, el) {
  loginTipo = tipo;
  document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('act'));
  el.classList.add('act');
}

async function doLogin() {
  const email = document.getElementById('l-email').value.trim();
  const pass  = document.getElementById('l-pass').value;
  const btn   = document.getElementById('btn-login');
  const errEl = document.getElementById('l-error');
  errEl.textContent = '';
  if (!email || !pass) { errEl.textContent = 'Completá todos los campos'; return; }
  btn.innerHTML = '<span class="loader-inline claro"></span> Ingresando...';
  btn.disabled = true;
  try {
    const data = await api('POST', `/auth/${loginTipo}/login`, { email, password: pass });
    S.token = data.token; S.nombre = data.nombre; S.tipo = loginTipo;
    if (loginTipo === 'comercio') S.slug = data.slug;
    localStorage.setItem('token', S.token);
    localStorage.setItem('tipo', S.tipo);
    localStorage.setItem('nombre', S.nombre);
    if (S.slug) localStorage.setItem('slug', S.slug);
    irPanel();
  } catch (e) {
    errEl.textContent = e.message;
    btn.innerHTML = 'Ingresar'; btn.disabled = false;
  }
}

function logout() {
  ['token','tipo','slug','nombre'].forEach(k => localStorage.removeItem(k));
  Object.assign(S, { token:null, tipo:null, slug:null, nombre:null });
  navegar('/login');
}

// ============================================================
// PANEL SUPER-ADMIN
// ============================================================
async function mostrarAdmin() {
  if (!S.token || S.tipo !== 'admin') { navegar('/admin-acceso'); return; }
  aplicarTemaPanel();
  const el = document.getElementById('panel-admin');
  el.classList.add('activa');
  el.innerHTML = `
    <aside class="admin-sidebar">
      <div class="admin-sidebar-logo">Agendate <span>Panel de Control</span></div>
      <nav class="admin-nav">
        <a href="#" onclick="adminSec('dashboard');return false" class="act" id="an-dashboard">Dashboard</a>
        <a href="#" onclick="adminSec('comercios');return false" id="an-comercios">Comercios</a>
        <a href="#" onclick="adminSec('reservas');return false" id="an-reservas">Reservas</a>
      </nav>
      <div class="admin-sidebar-bot">
        <div style="font-size:0.78rem;color:var(--texto2);margin-bottom:0.5rem">${S.nombre}</div>
        <button class="btn btn-ghost btn-sm btn-full" onclick="logout()">Cerrar sesión</button>
      </div>
    </aside>
    <main class="admin-main">
      <div class="admin-secciones">
        <div id="admin-dashboard" class="admin-sec act"></div>
        <div id="admin-comercios" class="admin-sec"></div>
        <div id="admin-reservas"  class="admin-sec"></div>
      </div>
    </main>`;
  cargarAdminDashboard();
}

function adminSec(sec) {
  document.querySelectorAll('.admin-sec').forEach(s => s.classList.remove('act'));
  document.querySelectorAll('.admin-nav a').forEach(a => a.classList.remove('act'));
  document.getElementById('admin-' + sec).classList.add('act');
  document.getElementById('an-' + sec).classList.add('act');
  if (sec === 'dashboard') cargarAdminDashboard();
  if (sec === 'comercios') cargarAdminComercios();
  if (sec === 'reservas')  cargarAdminReservas();
}

async function cargarAdminDashboard() {
  const el = document.getElementById('admin-dashboard');
  el.innerHTML = `<div class="admin-header"><h1>Dashboard</h1></div><div class="stats-grid" id="stats-grid"><div class="stat-card"><div class="loader-inline claro"></div></div></div>`;
  try {
    const stats = await api('GET', '/admin/stats');
    document.getElementById('stats-grid').innerHTML = `
      <div class="stat-card"><div class="stat-num">${stats.comercios_activos}</div><div class="stat-lbl">Comercios activos</div></div>
      <div class="stat-card"><div class="stat-num">${stats.total_reservas}</div><div class="stat-lbl">Total reservas</div></div>
      <div class="stat-card"><div class="stat-num">${stats.reservas_hoy}</div><div class="stat-lbl">Reservas hoy</div></div>`;
  } catch (e) { el.innerHTML += `<p style="color:var(--rojo)">${e.message}</p>`; }
}

async function cargarAdminComercios() {
  const el = document.getElementById('admin-comercios');
  el.innerHTML = `
    <div class="admin-header">
      <h1>Comercios</h1>
      <button class="btn btn-oro" onclick="abrirModalNuevoComercio()">+ Nuevo comercio</button>
    </div>
    <div class="table-wrap" id="tabla-comercios-wrap">
      <div style="padding:2rem;text-align:center"><span class="loader-inline claro"></span> Cargando...</div>
    </div>`;
  try {
    const data = await api('GET', '/admin/comercios');
    const wrap = document.getElementById('tabla-comercios-wrap');
    if (!data.length) { wrap.innerHTML = '<p style="padding:2rem;color:var(--texto2)">No hay comercios todavía.</p>'; return; }
    wrap.innerHTML = `<table class="tabla">
      <thead><tr><th>Comercio</th><th>Slug</th><th>Servicios</th><th>Reservas</th><th>Estado</th><th>Acciones</th></tr></thead>
      <tbody>${data.map(c => `
        <tr>
          <td><strong>${c.nombre}</strong><br><small style="color:var(--texto2)">${c.email_contacto||''}</small></td>
          <td><code style="color:var(--oro);font-size:0.82rem">/${c.slug}</code></td>
          <td>${c.total_servicios}</td>
          <td>${c.total_reservas}</td>
          <td><span class="badge ${c.activo ? 'badge-verde' : 'badge-rojo'}">${c.activo ? 'Activo' : 'Inactivo'}</span></td>
          <td style="display:flex;gap:0.4rem;flex-wrap:wrap">
            <button class="btn btn-ghost btn-sm" onclick="window.open('/${c.slug}','_blank')">Ver página</button>
            <button class="btn btn-ghost btn-sm" onclick="toggleComercio(${c.id},${c.activo})">${c.activo ? 'Desactivar' : 'Activar'}</button>
            <button class="btn btn-peligro btn-sm" onclick="eliminarComercio(${c.id},'${c.nombre}')">Eliminar</button>
          </td>
        </tr>`).join('')}</tbody></table>`;
  } catch (e) { el.innerHTML += `<p style="color:var(--rojo)">${e.message}</p>`; }
}

async function toggleComercio(id, activo) {
  try {
    await api('PUT', `/admin/comercios/${id}`, { activo: !activo });
    toast(activo ? 'Comercio desactivado' : 'Comercio activado');
    cargarAdminComercios();
  } catch (e) { toast(e.message, 'error'); }
}

async function eliminarComercio(id, nombre) {
  if (!confirm(`¿Eliminar "${nombre}"? Esta acción no se puede deshacer y borrará todas sus reservas.`)) return;
  try {
    await api('DELETE', `/admin/comercios/${id}`);
    toast('Comercio eliminado');
    cargarAdminComercios();
  } catch (e) { toast(e.message, 'error'); }
}

async function cargarAdminReservas() {
  const el = document.getElementById('admin-reservas');

  el.innerHTML = `
    <div class="admin-header">
      <h1>Reservas</h1>
    </div>

    <div style="max-width:420px;margin-bottom:1rem">
      <label class="label">Seleccionar comercio</label>
      <select class="input" id="admin-comercio-reservas" onchange="cargarAdminReservasDeComercio(this.value)">

      select.innerHTML = `<option value="">No hay comercios creados</option>`;
      return;
    }

    select.innerHTML = `
      <option value="">Elegí un comercio</option>
      ${comercios.map(c => `
        <option value="${c.id}">
          ${c.nombre} /${c.slug} — ${c.total_reservas || 0} reservas
        </option>
      `).join('')}
    `;
  } catch (e) {
    document.getElementById('admin-reservas-lista').innerHTML = `
      <p style="color:var(--rojo)">${e.message}</p>
    `;
  }
}

              <th>Fecha</th>
              <th>Hora</th>
              <th>Estado</th>
              <th>WhatsApp</th>
            </tr>
          </thead>

          <tbody>
            ${data.map(r => `
              <tr>
                <td>${r.cliente_nombre || ''} ${r.cliente_apellido || ''}</td>

                  <br>
                  <small style="color:var(--texto2)">
                    $ ${parseFloat(r.precio || 0).toLocaleString()}
                  </small>
                </td>

                <td>${r.fecha}</td>

                <td>${r.hora?.slice(0,5) || '—'}</td>

                <td>
                  <span class="badge ${
                    r.estado === 'cancelada' ? 'badge-rojo' :
                    r.estado === 'completada' ? 'badge-verde' :
                    'badge-gris'
                  }">
                    ${r.estado}
                  </span>
                </td>

                <td>
                  ${r.cliente_whatsapp 
                    ? `<a href="https://wa.me/${String(r.cliente_whatsapp).replace(/\D/g,'')}" target="_blank" style="font-size:0.78rem">${r.cliente_whatsapp}</a>` 
                    : '—'
                  }
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  } catch (e) {
    lista.innerHTML = `<p style="color:var(--rojo)">${e.message}</p>`;
  }
}

function getLinkPublicoComercio() {
  return `${window.location.origin}/${S.slug}`;
}

async function copiarLinkPublico() {
  try {
    const url = getLinkPublicoComercio();
    await navigator.clipboard.writeText(url);
    toast('Link copiado');
  } catch (e) {
    toast('No se pudo copiar el link', 'error');
  }
}

async function copiarTexto(texto, mensaje = 'Copiado') {
  try {
    await navigator.clipboard.writeText(texto);
    toast(mensaje);
  } catch (e) {
    toast('No se pudo copiar', 'error');
  }
}

function compartirLinkWhatsApp() {
  const url = getLinkPublicoComercio();
  const texto = `Reservá tu turno acá: ${url}`;
  window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
}

async function descargarQRComercio() {
  try {
    const url = getLinkPublicoComercio();
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=800x800&data=${encodeURIComponent(url)}`;
    const resp = await fetch(qrUrl);
    const blob = await resp.blob();
    const blobUrl = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = `qr-${S.slug}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(blobUrl);
  } catch (e) {
    toast('No se pudo descargar el QR', 'error');
  }
}

async function cargarComCalendario() {
  const el = document.getElementById('com-calendario');
  const base = window._calendarioPanelFecha || fechaHoyLocal();
  const fechaBase = new Date(base + 'T12:00:00');
  const desde = `${fechaBase.getFullYear()}-${String(fechaBase.getMonth() + 1).padStart(2, '0')}-01`;
  const hastaDate = new Date(fechaBase.getFullYear(), fechaBase.getMonth() + 1, 0);
  const hasta = `${hastaDate.getFullYear()}-${String(hastaDate.getMonth() + 1).padStart(2, '0')}-${String(hastaDate.getDate()).padStart(2, '0')}`;

  el.innerHTML = `
    <div class="com-header">
      <div>
        <h1>Calendario</h1>
        <small style="color:var(--texto2)">Vista mensual rápida de las reservas del comercio.</small>
      </div>
      <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="moverCalendarioPanel(-1)">Anterior</button>
        <button class="btn btn-ghost btn-sm" onclick="moverCalendarioPanel(1)">Siguiente</button>
      </div>
    </div>
    <div id="calendario-panel-lista"><span class="loader-inline claro"></span> Cargando calendario...</div>
  `;

  try {
    const data = await api('GET', `/comercio/${S.slug}/reservas?desde=${desde}&hasta=${hasta}`);
    const estadoFiltro = window._calFiltroEstado || '';
    const trabajadorFiltro = window._calFiltroTrabajador || '';
    const trabajadoresMes = [...new Map(data.filter(r => r.trabajador_id).map(r => [String(r.trabajador_id), r.trabajador_nombre || 'Profesional'])).entries()];
    const filtrosHTML = `
      <div class="card" style="margin-bottom:1rem">
        <div class="input-grid-2">
          <div class="form-group" style="margin-bottom:0">
            <label class="label">Estado</label>
            <select class="input" onchange="window._calFiltroEstado=this.value;cargarComCalendario()">
              <option value="" ${!estadoFiltro ? 'selected' : ''}>Todos</option>
              <option value="pendiente" ${estadoFiltro === 'pendiente' ? 'selected' : ''}>Pendientes</option>
              <option value="confirmada" ${estadoFiltro === 'confirmada' ? 'selected' : ''}>Confirmadas</option>
              <option value="completada" ${estadoFiltro === 'completada' ? 'selected' : ''}>Completadas</option>
              <option value="cancelada" ${estadoFiltro === 'cancelada' ? 'selected' : ''}>Canceladas</option>
              <option value="no_asistio" ${estadoFiltro === 'no_asistio' ? 'selected' : ''}>No asistió</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label class="label">Profesional</label>
            <select class="input" onchange="window._calFiltroTrabajador=this.value;cargarComCalendario()">
              <option value="" ${!trabajadorFiltro ? 'selected' : ''}>Todos</option>
              ${trabajadoresMes.map(([id, nombre]) => `<option value="${id}" ${trabajadorFiltro === id ? 'selected' : ''}>${nombre}</option>`).join('')}
            </select>
          </div>
        </div>
      </div>
    `;
    const reservasFiltradas = data.filter(r => {
      if (estadoFiltro && r.estado !== estadoFiltro) return false;
      if (trabajadorFiltro && String(r.trabajador_id || '') !== trabajadorFiltro) return false;
      return true;
    });
    const porFecha = reservasFiltradas.reduce((acc, r) => {
      const clave = String(r.fecha).slice(0, 10);
      if (!acc[clave]) acc[clave] = [];
      acc[clave].push(r);
      return acc;
    }, {});

    const fechas = Object.keys(porFecha).sort();
    const lista = document.getElementById('calendario-panel-lista');

    if (!fechas.length) {
      lista.innerHTML = `${filtrosHTML}<div class="card" style="color:var(--texto2)">No hay reservas para esos filtros en este mes.</div>`;
      return;
    }

    lista.innerHTML = `
      ${filtrosHTML}
      <div class="panel-soft-grid">
        ${fechas.map(fecha => `
          <div class="panel-soft-card">
            <h3>${formatearFechaReserva(fecha)}</h3>
            <div style="display:flex;flex-direction:column;gap:0.55rem;margin-top:0.8rem">
              ${porFecha[fecha].map(r => `

function colorEstadoCalendario(estado) {

}

function moverCalendarioPanel(meses) {
  const base = new Date((window._calendarioPanelFecha || fechaHoyLocal()) + 'T12:00:00');
  base.setMonth(base.getMonth() + meses);
  window._calendarioPanelFecha = `${base.getFullYear()}-${String(base.getMonth() + 1).padStart(2, '0')}-01`;
  cargarComCalendario();
}

async function cargarComCalendario() {
  const el = document.getElementById('com-calendario');
  const base = window._calendarioPanelFecha || fechaHoyLocal();
  const fechaBase = new Date(base + 'T12:00:00');
  const desde = `${fechaBase.getFullYear()}-${String(fechaBase.getMonth() + 1).padStart(2, '0')}-01`;
  const hastaDate = new Date(fechaBase.getFullYear(), fechaBase.getMonth() + 1, 0);
  const hasta = `${hastaDate.getFullYear()}-${String(hastaDate.getMonth() + 1).padStart(2, '0')}-${String(hastaDate.getDate()).padStart(2, '0')}`;

  el.innerHTML = `
    <div class="com-header">
      <div>
        <h1>Calendario</h1>
        <small style="color:var(--texto2)">Vista mensual rápida de las reservas del comercio.</small>
      </div>
      <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
        <button class="btn btn-oro btn-sm" onclick="abrirModalReservaManual()">+ Nueva reserva</button>
        <button class="btn btn-ghost btn-sm" onclick="calIrHoy()">Hoy</button>
        <button class="btn btn-ghost btn-sm" onclick="moverCalendarioPanel(-1)">Anterior</button>
        <button class="btn btn-ghost btn-sm" onclick="moverCalendarioPanel(1)">Siguiente</button>
      </div>
    </div>
    <div id="calendario-panel-lista"><span class="loader-inline claro"></span> Cargando calendario...</div>
  `;

  try {
    const data = await api('GET', `/comercio/${S.slug}/reservas?desde=${desde}&hasta=${hasta}`);
    const estadoFiltro = window._calFiltroEstado || '';
    const trabajadorFiltro = window._calFiltroTrabajador || '';
    const trabajadoresMes = [...new Map(data.filter(r => r.trabajador_id).map(r => [String(r.trabajador_id), r.trabajador_nombre || 'Profesional'])).entries()];
    const filtrosHTML = `
      <div class="card" style="margin-bottom:1rem">
        <div class="input-grid-2">
          <div class="form-group" style="margin-bottom:0">
            <label class="label">Estado</label>
            <select class="input" onchange="window._calFiltroEstado=this.value;cargarComCalendario()">
              <option value="" ${!estadoFiltro ? 'selected' : ''}>Todos</option>
              <option value="pendiente" ${estadoFiltro === 'pendiente' ? 'selected' : ''}>Pendientes</option>
              <option value="confirmada" ${estadoFiltro === 'confirmada' ? 'selected' : ''}>Confirmadas</option>
              <option value="completada" ${estadoFiltro === 'completada' ? 'selected' : ''}>Completadas</option>
              <option value="cancelada" ${estadoFiltro === 'cancelada' ? 'selected' : ''}>Canceladas</option>
              <option value="no_asistio" ${estadoFiltro === 'no_asistio' ? 'selected' : ''}>No asistió</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label class="label">Profesional</label>
            <select class="input" onchange="window._calFiltroTrabajador=this.value;cargarComCalendario()">
              <option value="" ${!trabajadorFiltro ? 'selected' : ''}>Todos</option>
              ${trabajadoresMes.map(([id, nombre]) => `<option value="${id}" ${trabajadorFiltro === id ? 'selected' : ''}>${nombre}</option>`).join('')}
            </select>
          </div>
        </div>
      </div>
    `;

    const reservasFiltradas = data.filter(r => {
      if (estadoFiltro && r.estado !== estadoFiltro) return false;
      if (trabajadorFiltro && String(r.trabajador_id || '') !== trabajadorFiltro) return false;
      return true;
    });
    const porFecha = reservasFiltradas.reduce((acc, r) => {
      const clave = String(r.fecha).slice(0, 10);
      if (!acc[clave]) acc[clave] = [];
      acc[clave].push(r);
      return acc;
    }, {});

    const hoy = fechaHoyLocal();
    const seleccionActual = window._calDiaSeleccionado;
    const primerConReserva = Object.keys(porFecha).sort()[0];
    const seleccionado = seleccionActual && seleccionActual >= desde && seleccionActual <= hasta
      ? seleccionActual
      : (hoy >= desde && hoy <= hasta ? hoy : (primerConReserva || desde));
    window._calDiaSeleccionado = seleccionado;
    const dias = construirDiasCalendario(fechaBase, porFecha);
    const reservasDelDia = porFecha[seleccionado] || [];

    document.getElementById('calendario-panel-lista').innerHTML = `
      ${filtrosHTML}
      <div class="calendario-modern">
        <div class="calendario-shell">
          <div class="calendario-modern-head">
            <div>
              <div class="calendario-modern-title">${MESES[fechaBase.getMonth()]} ${fechaBase.getFullYear()}</div>
              <div class="calendario-modern-sub">${reservasFiltradas.length} reservas en el mes seleccionado</div>
            </div>
            <div style="display:flex;gap:0.45rem;flex-wrap:wrap">
              ${resumenEstadosCalendario(reservasFiltradas)}
            </div>
          </div>
          <div class="calendario-week">${DIAS.map(d => `<span>${d}</span>`).join('')}</div>
          <div class="calendario-month">
            ${dias.map(dia => renderDiaCalendario(dia, seleccionado)).join('')}
          </div>
        </div>

        <aside class="cal-side">
          <div class="calendario-modern-title">${formatearFechaReserva(seleccionado)}</div>
          <div class="calendario-modern-sub">${reservasDelDia.length ? `${reservasDelDia.length} turno(s) para este día` : 'Sin turnos para este día'}</div>
          <div class="cal-side-list">
            ${reservasDelDia.length ? reservasDelDia.map(r => `
              <button class="cal-res-card" style="border-left-color:${colorEstadoCalendario(r.estado)}" onclick="abrirDetalleReserva(${r.id})">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:0.6rem">
                  <span class="cal-res-time">${horaCorta(r.hora)}</span>
                  <span class="badge ${badgeEstado(r.estado)}">${estadoReservaLabel(r.estado)}</span>
                </div>
                <div class="cal-res-client">${reservaNombreCliente(r)}</div>
                <div class="cal-res-meta">
                  ${r.servicio_nombre || 'Servicio sin nombre'}${r.trabajador_nombre ? ` · ${r.trabajador_nombre}` : ''}
                  ${r.ubicacion_nombre ? `<br>${r.ubicacion_nombre}` : ''}
                </div>
              </button>
            `).join('') : `
              <div class="card" style="color:var(--texto2);padding:1rem">
                No hay reservas para mostrar. Podés crear una nueva reserva manual desde el botón superior.
              </div>
            `}
          </div>
        </aside>
      </div>
    `;
  } catch (e) {
    document.getElementById('calendario-panel-lista').innerHTML = `<p style="color:var(--rojo)">${e.message}</p>`;
  }
}

function construirDiasCalendario(fechaBase, porFecha) {
  const year = fechaBase.getFullYear();
  const month = fechaBase.getMonth();
  const primerDia = new Date(year, month, 1);
  const inicio = new Date(year, month, 1 - primerDia.getDay());
  return Array.from({ length: 42 }, (_, i) => {
    const d = new Date(inicio);
    d.setDate(inicio.getDate() + i);
    const fecha = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const reservas = porFecha[fecha] || [];
    return { fecha, dia: d.getDate(), fuera: d.getMonth() !== month, hoy: fecha === fechaHoyLocal(), reservas };
  });
}

function renderDiaCalendario(dia, seleccionado) {
  const estados = dia.reservas.reduce((acc, r) => {
    const estado = r.estado || 'confirmada';
    acc[estado] = (acc[estado] || 0) + 1;
    return acc;
  }, {});
  const principales = Object.entries(estados).slice(0, 3);
  const clases = ['cal-dia', dia.fuera ? 'fuera' : '', dia.hoy ? 'hoy' : '', dia.fecha === seleccionado ? 'sel' : ''].filter(Boolean).join(' ');

  return `
    <button class="${clases}" onclick="calSeleccionarDia('${dia.fecha}')">
      <span class="cal-num">${dia.dia}</span>
      ${dia.reservas.length ? `<span class="cal-dia-total">${dia.reservas.length} reserva${dia.reservas.length === 1 ? '' : 's'}</span>` : '<span class="cal-dia-total">Libre</span>'}
      <span class="cal-pills">
        ${principales.map(([estado, cantidad]) => `<span class="cal-pill ${estado}">${cantidad}</span>`).join('')}
        ${Object.keys(estados).length > 3 ? `<span class="cal-dia-more">+${Object.keys(estados).length - 3}</span>` : ''}
      </span>
    </button>
  `;
}

function resumenEstadosCalendario(reservas) {
  const estados = ['pendiente', 'confirmada', 'completada', 'cancelada', 'no_asistio'];
  return estados.map(estado => {
    const total = reservas.filter(r => r.estado === estado).length;
    if (!total) return '';
    return `<span class="badge ${badgeEstado(estado)}">${estadoReservaLabel(estado)}: ${total}</span>`;
  }).join('') || '<span class="badge badge-gris">Sin reservas</span>';
}

function calSeleccionarDia(fecha) {
  window._calDiaSeleccionado = fecha;
  cargarComCalendario();
}

function calIrHoy() {
  const hoy = fechaHoyLocal();
  window._calendarioPanelFecha = hoy.slice(0, 7) + '-01';
  window._calDiaSeleccionado = hoy;
  cargarComCalendario();
}

      avatarUrl = subida.url;
    }

    const actualizado = await api('PUT', `/comercio/${S.slug}/cuenta`, {
      nombre: document.getElementById('cu-nombre').value.trim(),
      avatar_url: avatarUrl,
      password_actual: document.getElementById('cu-pass-actual').value,
      password_nuevo: document.getElementById('cu-pass-nueva').value
    });

    if (actualizado?.nombre) {
      S.nombre = actualizado.nombre;
      localStorage.setItem('nombre', actualizado.nombre);
    }

    document.getElementById('cs-user-name').textContent = actualizado.nombre || S.nombre;
    const avatarSidebar = document.getElementById('cs-avatar');
    if (avatarSidebar && actualizado.avatar_url) {
      avatarSidebar.innerHTML = `<img src="${actualizado.avatar_url}" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`;
    } else if (avatarSidebar) {
      avatarSidebar.textContent = inicialesPanel(actualizado.nombre || S.nombre);
    }
    toast('Perfil actualizado');
    cargarComCuenta();
  } catch (e) {
    toast(e.message, 'error');
  }
}

function comSec(sec, guardarHistorial = true) {
  if (guardarHistorial && location.pathname === '/panel') {
    history.pushState({}, '', `/panel#${sec}`);
  }

  document.querySelectorAll('.com-sec').forEach(s => s.classList.remove('act'));

  document.getElementById('com-' + sec).classList.add('act');

function fechaHoyLocal() {
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

function sumarDiasISO(fechaISO, dias) {
  const base = fechaISO ? new Date(fechaISO + 'T12:00:00') : new Date();
  base.setDate(base.getDate() + dias);
  return `${base.getFullYear()}-${String(base.getMonth() + 1).padStart(2, '0')}-${String(base.getDate()).padStart(2, '0')}`;
}

function renderMiniCalendarioReservas(fechaActiva) {
  const inicio = fechaActiva || fechaHoyLocal();
  const dias = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];

  return Array.from({ length: 7 }, (_, i) => {
    const fecha = sumarDiasISO(inicio, i);
    const d = new Date(fecha + 'T12:00:00');
    const activo = fecha === fechaActiva;

    return `
      <button
        class="btn ${activo ? 'btn-oro' : 'btn-ghost'} btn-sm"
        style="min-width:92px"
        onclick="cargarComReservas('${fecha}')"
      >
        <span style="display:block;font-size:0.72rem">${dias[d.getDay()]}</span>
        <strong>${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}</strong>
      </button>
    `;
  }).join('');
}

function formatearFechaReserva(fecha) {
  if (!fecha) return '—';

  const limpia = String(fecha).slice(0, 10);
  const partes = limpia.split('-');

  if (partes.length !== 3) return fecha;

  const [yyyy, mm, dd] = partes;

  return `${dd}/${mm}/${yyyy}`;
}

function formatoDinero(valor, moneda = '$') {
  return `${moneda} ${Number(valor || 0).toLocaleString()}`;
}

function inicioMesActual() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`;
}

function finMesActual() {
  const d = new Date();
  const fin = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  return `${fin.getFullYear()}-${String(fin.getMonth() + 1).padStart(2, '0')}-${String(fin.getDate()).padStart(2, '0')}`;
}

function estadoReservaLabel(estado) {
  const labels = {
    pendiente: 'Pendiente',
    confirmada: 'Confirmada',
    completada: 'Completada',
    cancelada: 'Cancelada',
    no_asistio: 'No asistió'
  };

  return labels[estado] || estado || 'Sin estado';
}

function badgeEstado(estado) {
  const badges = {
    pendiente: 'badge-oro',
    confirmada: 'badge-verde',
    completada: 'badge-verde',
    cancelada: 'badge-gris',
    no_asistio: 'badge-gris'
  };

  return badges[estado] || 'badge-gris';
}

function labelFormaPago(valor) {
  const labels = {
    local: 'Paga al asistir',
    online: 'Paga al reservar',
    sena: 'Paga seña'
  };

  return labels[valor] || 'Sin definir';
}

function labelEstadoPago(valor) {
  const labels = {
    pendiente: 'Pendiente',
    parcial: 'Parcial',
    pagado: 'Pagado'
  };

  return labels[valor] || 'Pendiente';
}

function horaCorta(hora) {
  return hora ? String(hora).slice(0, 5) : '';
}

function actualizarServiciosReservaManual() {
  const trabajadorId = document.getElementById('rm-trabajador')?.value || '';
  const servicioSelect = document.getElementById('rm-servicio');

  if (!servicioSelect) return;

  let primerVisible = null;

  Array.from(servicioSelect.options).forEach(option => {
    const servicioTrabajadorId = option.dataset.trabajadorId || '';
    const visible = !trabajadorId || !servicioTrabajadorId || servicioTrabajadorId === trabajadorId;

    option.hidden = !visible;
    option.disabled = !visible;

    if (visible && !primerVisible) primerVisible = option;
  });

  if (servicioSelect.selectedOptions[0]?.disabled && primerVisible) {
    servicioSelect.value = primerVisible.value;
  }

  actualizarResumenPagoReservaManual();
}

function calcularSenaFrontend(option) {
  if (!option || !option.dataset.requiereSena) return 0;

  const precio = Number(option.dataset.precio || 0);
  const valor = Number(option.dataset.senaValor || 0);

  if (valor <= 0) return 0;

  if (option.dataset.senaTipo === 'porcentaje') {
    return Math.round((precio * valor / 100) * 100) / 100;
  }

  return Math.round(valor * 100) / 100;
}

function actualizarResumenPagoReservaManual() {
  const servicioSelect = document.getElementById('rm-servicio');
  const resumen = document.getElementById('rm-resumen-pago');
  const formaPago = document.getElementById('rm-forma-pago');
  const estadoPago = document.getElementById('rm-estado-pago');

  if (!servicioSelect || !resumen) return;

  const option = servicioSelect.selectedOptions[0];
  const sena = calcularSenaFrontend(option);
  const moneda = S.comercio?.moneda || '$';

  if (sena > 0) {
    resumen.innerHTML = `Este servicio requiere seña o pago anticipado de <strong style="color:var(--oro)">${moneda} ${sena.toLocaleString()}</strong>.`;
    if (formaPago && formaPago.value === 'local') formaPago.value = 'sena';
    if (estadoPago && estadoPago.value === 'pendiente') estadoPago.value = 'parcial';
  } else {
    resumen.innerHTML = 'Este servicio no tiene seña ni pago anticipado obligatorio. Podés marcar pago en local u online.';
  }
}

function abrirModalTrabajador(t = null) {

async function abrirHorariosTrabajador(t) {
  const el = document.getElementById('com-trabajadores');

  el.innerHTML = `
    <div class="com-header">
      <div>
        <h1>Horarios de ${t.nombre}</h1>
        <p style="color:var(--texto2);font-size:0.85rem;margin-top:0.25rem">
          Estos horarios se usan solo para la agenda de este profesional.
        </p>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="cargarComTrabajadores()">Volver</button>
    </div>

    <div id="trabajador-horarios-form">
      <span class="loader-inline claro"></span> Cargando horarios...
    </div>
  `;

  try {
    const data = await api('GET', `/comercio/${S.slug}/trabajadores/${t.id}/horarios`);

    const bloquesPorDia = {};
    (data.horario_bloques || []).forEach(b => {
      if (!bloquesPorDia[b.dia_semana]) bloquesPorDia[b.dia_semana] = [];
      bloquesPorDia[b.dia_semana].push({
        abre: String(b.abre).slice(0,5),
        cierra: String(b.cierra).slice(0,5)
      });
    });

    window._trabajadorHorariosEditor = DIAS_FULL.map((_, i) => {
      const bloques = bloquesPorDia[i] || [];
      return {
        dia_semana: i,
        activo: bloques.length > 0,
        bloques: bloques.length ? bloques : [{ abre: '09:00', cierra: '18:00' }]
      };
    });

    renderHorariosTrabajadorForm(t);
  } catch (e) {
    document.getElementById('trabajador-horarios-form').innerHTML = `<p style="color:var(--rojo)">${e.message}</p>`;
  }
}

function renderHorariosTrabajadorForm(t) {
  const el = document.getElementById('trabajador-horarios-form');

      ${DIAS_FULL.map((dia, i) => {
        const item = window._trabajadorHorariosEditor[i];

        return `

              <input 
                type="checkbox"

async function guardarHorariosTrabajador(id) {
  const horarios = window._trabajadorHorariosEditor.map(h => ({
    dia_semana: h.dia_semana,
    activo: h.activo,
    bloques: h.activo ? h.bloques : []
  }));

  try {
    await api('PUT', `/comercio/${S.slug}/trabajadores/${id}/horarios`, { horarios });
    toast('Horarios del profesional guardados');
    cargarComTrabajadores();
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function eliminarTrabajador(id) {
  if (!confirm('Eliminar este profesional? Sus reservas anteriores se mantienen.')) return;

  try {
    await api('DELETE', `/comercio/${S.slug}/trabajadores/${id}`);
    toast('Profesional eliminado');
    cargarComTrabajadores();
  } catch (e) {
    toast(e.message, 'error');
  }
}

function prevImgUrl(inputId, previewId) {
  const url = document.getElementById(inputId)?.value?.trim();
  const prev = document.getElementById(previewId);
  if (!prev) return;
  if (url) { prev.src = url; prev.classList.add('visible'); prev.onerror = () => prev.classList.remove('visible'); }
  else { prev.classList.remove('visible'); }
}

    });

    const bloquesMap = {};
    (data.horario_bloques || []).forEach(b => {
      if (!bloquesMap[b.dia_semana]) bloquesMap[b.dia_semana] = [];

      bloquesMap[b.dia_semana].push({
        abre: b.abre?.slice(0, 5) || '09:00',
        cierra: b.cierra?.slice(0, 5) || '19:00'
      });
    });

    window._horariosEditor = DIAS_FULL.map((_, i) => {
      const bloques = (bloquesMap[i] || [])
        .sort((a, b) => horaAMin(a.abre) - horaAMin(b.abre));

      const h = horMap[i];

      if (bloques.length > 0) {
        const descansos = [];

        for (let j = 1; j < bloques.length; j++) {
          descansos.push({
            desde: bloques[j - 1].cierra,
            hasta: bloques[j].abre
          });
        }

        return {
          activo: true,
          abre: bloques[0].abre,
          cierra: bloques[bloques.length - 1].cierra,
          descansos
        };
      }

      return {
        activo: !!h,
        abre: h?.abre?.slice(0, 5) || '09:00',
        cierra: h?.cierra?.slice(0, 5) || '19:00',
        descansos: []
      };
    });

    renderHorariosForm();
  } catch (e) {
    el.innerHTML = `<p style="color:var(--rojo)">${e.message}</p>`;
  }
}

function horaAMin(hora) {
  const [h, m] = String(hora || '').split(':').map(Number);

  if (!Number.isFinite(h) || !Number.isFinite(m)) {
    return null;
  }

  return h * 60 + m;
}

function construirBloquesTrabajo(dia) {
  const abreMin = horaAMin(dia.abre);
  const cierraMin = horaAMin(dia.cierra);

  if (abreMin === null || cierraMin === null || cierraMin <= abreMin) {
    return {
      error: 'El horario de cierre debe ser mayor que el de apertura'
    };
  }

  const descansos = (dia.descansos || [])
    .filter(d => d.desde && d.hasta)
    .map(d => ({
      desde: d.desde,
      hasta: d.hasta,
      desdeMin: horaAMin(d.desde),
      hastaMin: horaAMin(d.hasta)
    }))
    .sort((a, b) => a.desdeMin - b.desdeMin);

  for (let i = 0; i < descansos.length; i++) {
    const d = descansos[i];

    if (d.desdeMin === null || d.hastaMin === null || d.hastaMin <= d.desdeMin) {
      return {
        error: `El descanso ${i + 1} está mal cargado`
      };
    }

    if (d.desdeMin < abreMin || d.hastaMin > cierraMin) {
      return {
        error: `El descanso ${i + 1} debe estar dentro del horario de atención`
      };
    }

    if (i > 0 && d.desdeMin < descansos[i - 1].hastaMin) {
      return {
        error: `Los descansos no pueden superponerse`
      };
    }
  }

  const bloques = [];
  let cursor = dia.abre;

  for (const descanso of descansos) {
    if (horaAMin(descanso.desde) > horaAMin(cursor)) {
      bloques.push({
        abre: cursor,
        cierra: descanso.desde
      });
    }

    cursor = descanso.hasta;
  }

  if (horaAMin(cursor) < cierraMin) {
    bloques.push({
      abre: cursor,
      cierra: dia.cierra
    });
  }

  return { bloques };
}

async function guardarHorarios() {
  const horarios = [];

  for (let i = 0; i < window._horariosEditor.length; i++) {
    const dia = window._horariosEditor[i];

    if (!dia.activo) {
      horarios.push({
        dia_semana: i,
        activo: false,
        bloques: []
      });

      continue;
    }

    const resultado = construirBloquesTrabajo(dia);

    if (resultado.error) {
      toast(`${DIAS_FULL[i]}: ${resultado.error}`, 'error');
      return;
    }

    if (!resultado.bloques.length) {
      toast(`${DIAS_FULL[i]}: el descanso ocupa todo el horario`, 'error');
      return;
    }

    horarios.push({
      dia_semana: i,
      activo: true,
      abre: resultado.bloques[0].abre,
      cierra: resultado.bloques[0].cierra,
      bloques: resultado.bloques
    });
  }

  try {
    await api('PUT', `/comercio/${S.slug}/perfil`, {
      anticipacion_reserva_min: Number(document.getElementById('hor-ant-res')?.value || 0),
      anticipacion_cancelacion_min: Number(document.getElementById('hor-ant-can')?.value || 0)
    });

    await api('PUT', `/comercio/${S.slug}/horarios`, { horarios });
    toast('Horarios guardados correctamente');
    cargarComHorarios();
  } catch (e) {
    toast(e.message, 'error');
  }
}

function actualizarPreviewPerfil() {
  const nombre = document.getElementById('pf-nom')?.value || 'Nombre del comercio';
  const slogan = document.getElementById('pf-slo')?.value || 'Tu frase principal va a aparecer acá.';
  const temaClaro = String(document.getElementById('pf-tema')?.value || '').toLowerCase() === '#ffffff';
  const logoPreview = document.getElementById('pf-logo-preview');
  const fondoPreview = document.getElementById('pf-fondo-preview');
  const previewNombre = document.getElementById('perfil-preview-nombre');
  const previewSlogan = document.getElementById('perfil-preview-slogan');
  const previewLogo = document.getElementById('perfil-preview-logo');
  const previewHero = document.getElementById('perfil-preview-hero');
  const previewBtn = document.getElementById('perfil-preview-btn');

  if (previewNombre) previewNombre.textContent = nombre;
  if (previewSlogan) previewSlogan.textContent = slogan;

  if (previewBtn) {
    previewBtn.style.background = 'rgba(255,255,255,0.08)';
    previewBtn.style.color = '#fff';
    previewBtn.style.border = '1px solid rgba(255,255,255,0.55)';
    previewBtn.style.backdropFilter = 'blur(4px)';
  }

  if (previewLogo) {
    const src = logoPreview?.classList.contains('visible') ? logoPreview.src : document.getElementById('pf-logo')?.value;
    previewLogo.src = src || '';
    previewLogo.style.display = src ? 'block' : 'none';
  }

  if (previewHero) {
    const fondoSrc = fondoPreview?.classList.contains('visible') ? fondoPreview.src : document.getElementById('pf-fondo')?.value;
    previewHero.style.backgroundImage = fondoSrc ? `url('${fondoSrc}')` : '';
    previewHero.style.backgroundColor = temaClaro ? '#F7F4EE' : '#111';
  }
}

function formatearFechaPublica(fecha) {
  if (!fecha) return '';
  const d = new Date(fecha + 'T12:00:00');
  return d.toLocaleDateString('es-UY', {
    weekday: 'long',
    day: '2-digit',
    month: '2-digit',
    year: 'numeric'
  });
}

async function confirmarCancelacionPublica(uuid) {
  const ok = confirm('¿Seguro que querés cancelar esta reserva?');

  if (!ok) return;

  const msg = document.getElementById('cancelar-msg');
  if (msg) {
    msg.innerHTML = `<p style="color:var(--texto2);margin-bottom:1rem">Cancelando reserva...</p>`;
  }

  try {
    await api('POST', `/p/reservas/${uuid}/cancelar`);

    if (msg) {
      msg.innerHTML = `
        <div class="badge badge-rojo" style="margin-bottom:1rem">
          Reserva cancelada correctamente
        </div>
      `;
    }

    const btn = document.querySelector('button.btn-peligro');
    if (btn) btn.remove();
  } catch (e) {
    if (msg) {
      msg.innerHTML = `<p style="color:var(--rojo);margin-bottom:1rem">${e.message}</p>`;
    }
  }
}

    S.comercio = data;
    S.reserva = {};
    S.paso = 1;
    S.calMes = new Date().getMonth();
    S.calAnio = new Date().getFullYear();
    document.title = data.nombre + ' · Reservas';
    renderComercioPublico(data);
  } catch (e) {
    el.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem">
      <h2>Comercio no encontrado</h2>
      <p style="color:var(--texto2)">El enlace puede ser incorrecto o el comercio está inactivo.</p></div>`;
  }
}

}

function volverAInfoPublica() {
  const sec = document.getElementById('pc-reservas');
  sec?.classList.remove('abierto');
  document.getElementById('pc-servicios')?.scrollIntoView({ behavior: 'smooth' });
}

  const btn = document.getElementById('pc-float-wa');

  window.addEventListener('scroll', () => {

  document.querySelectorAll('.opc-serv').forEach(el => {

function elegirServicioReserva(id) {
  const s = S.comercio.servicios.find(x => Number(x.id) === Number(id));
  if (!s) return;
  if (S.reserva.trabajador && s.trabajador_id && Number(s.trabajador_id) !== Number(S.reserva.trabajador.id)) {
    toast('Ese servicio pertenece a otro profesional', 'error');
    return;
  }

  S.reserva.servicio = s;
  S.reserva.fecha = null;
  S.reserva.hora = null;
  document.querySelectorAll('.opc-serv').forEach(el => el.classList.remove('sel'));
  document.querySelector(`.opc-serv[data-id="${id}"]`)?.classList.add('sel');

  if (!S.reserva.trabajador && s.trabajador_id) {
    const t = (S.comercio.trabajadores || []).find(x => Number(x.id) === Number(s.trabajador_id));
    if (t) {
      S.reserva.trabajador = t;
      document.querySelector(`[data-trabajador-id="${t.id}"]`)?.classList.add('sel');
    }
  }

  const btn = document.getElementById('pc-btn23');
  if (btn) btn.disabled = false;

  const btnProfesional = document.getElementById('pc-btn12');
  if (btnProfesional && S.reserva.trabajador) btnProfesional.disabled = false;

  const btnFecha = document.getElementById('pc-btn34');
  if (btnFecha) btnFecha.disabled = true;

  const btnHora = document.getElementById('pc-btn45');
  if (btnHora) btnHora.disabled = true;
}
function elegirTrabajadorReserva(id) {
  if (S.reserva.servicio?.trabajador_id && Number(id) !== Number(S.reserva.servicio.trabajador_id)) {

// CALENDARIO PÚBLICO
function pcRenderCalendario() {
  const tit = document.getElementById('pc-cal-tit');
  if (!tit) return;
  tit.textContent = MESES[S.calMes] + ' ' + S.calAnio;
  const grid = document.getElementById('pc-cal-grid');
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const diasHorario = {};
  (S.comercio.horarios||[]).forEach(h => diasHorario[h.dia_semana] = h);
  // También considerar días con bloques como habilitados
  (S.comercio.horario_bloques||[]).forEach(b => { if (!diasHorario[b.dia_semana]) diasHorario[b.dia_semana] = b; });

  let html = DIAS.map(d => `<div class="cal-dn">${d}</div>`).join('');
  const primerDia = new Date(S.calAnio, S.calMes, 1).getDay();
  for (let i = 0; i < primerDia; i++) html += '<div></div>';
  const total = new Date(S.calAnio, S.calMes + 1, 0).getDate();
  for (let d = 1; d <= total; d++) {
    const fecha = new Date(S.calAnio, S.calMes, d);
    const esPasado = fecha < hoy;
    const habilitado = diasHorario[fecha.getDay()];
    const esHoy = fecha.getTime() === hoy.getTime();
    const sel = S.reserva.fecha && fecha.toDateString() === S.reserva.fecha.toDateString();
    let cls = 'cal-d';
    let onclick = '';
    if (esPasado) cls += ' pas';
    else if (!habilitado) cls += ' cer';
    else if (sel) cls += ' sel';
    else { cls += ' disp'; onclick = `onclick="pcElegirFecha(${S.calAnio},${S.calMes},${d})"`; }
    if (esHoy && !esPasado) cls += ' hoy';
    html += `<div class="${cls}" ${onclick}>${d}</div>`;
  }
  grid.innerHTML = html;
}

function pcCambiarMes(d) {
  S.calMes += d;
  if (S.calMes > 11) { S.calMes = 0; S.calAnio++; }
  if (S.calMes < 0)  { S.calMes = 11; S.calAnio--; }
  pcRenderCalendario();
}

function pcElegirFecha(a, m, d) {
  S.reserva.fecha = new Date(a, m, d);
  S.reserva.hora = null;
  document.getElementById('pc-btn34').disabled = false;
  const btnHora = document.getElementById('pc-btn45');
  if (btnHora) btnHora.disabled = true;
  pcRenderCalendario();
}

async function pcCargarHoras() {
  const grid = document.getElementById('pc-horas-grid');
  const loading = document.getElementById('pc-horas-loading');
  if (!S.reserva.fecha || !S.reserva.servicio) return;
  const fStr = S.reserva.fecha.toISOString().split('T')[0];
  const fDisplay = S.reserva.fecha.toLocaleDateString('es-UY', { weekday:'long', day:'numeric', month:'long' });
  const prof = S.reserva.trabajador ? ` con ${S.reserva.trabajador.nombre}` : '';
  document.getElementById('pc-paso3-sub').textContent = 'Disponibilidad para ' + fDisplay.charAt(0).toUpperCase() + fDisplay.slice(1) + prof;
  grid.innerHTML = '';
  loading.style.display = 'block';
  try {
    const trabajadorParam = S.reserva.trabajador ? `&trabajador_id=${S.reserva.trabajador.id}` : '';
    const data = await api('GET', `/p/${S.comercio.slug}/disponibilidad?fecha=${fStr}&servicio_id=${S.reserva.servicio.id}${trabajadorParam}`);
    loading.style.display = 'none';
    if (!data.horas?.length) { grid.innerHTML = '<p style="color:var(--texto2);padding:1rem">Sin horarios disponibles para este día.</p>'; return; }
    grid.innerHTML = data.horas.map(h => `<button class="hora-b${S.reserva.hora===h?' sel':''}" onclick="pcElegirHora('${h}',this)">${h}</button>`).join('');
  } catch(e) { loading.style.display = 'none'; grid.innerHTML = `<p style="color:var(--rojo)">${e.message}</p>`; }
}

function pcElegirHora(hora, btn) {
  S.reserva.hora = hora;
  document.getElementById('pc-btn45').disabled = false;
  document.querySelectorAll('.hora-b').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
}

} else {

function calcularSenaServicioPublico(servicio) {
  if (!servicio?.requiere_sena) return 0;
  const precio = Number(servicio.precio || 0);
  const valor = Number(servicio.sena_valor || 0);
  if (valor <= 0) return 0;
  if (servicio.sena_tipo === 'porcentaje') return Math.round((precio * valor / 100) * 100) / 100;
  return Math.round(valor * 100) / 100;
}
