function pcReiniciar() {
  S.reserva = {
    servicio: null,
    trabajador: null,
    fecha: null,
    hora: null,
    nombre: '',
    apellido: '',
    wa: '',
    email: '',
    ubicacion_id: null,
    comentarios: ''
  };

  S.paso = 1;
  S.calMes = new Date().getMonth();
  S.calAnio = new Date().getFullYear();

  document.querySelectorAll('.opc-s').forEach(el => el.classList.remove('sel'));
  document.querySelectorAll('.hora-b').forEach(el => el.classList.remove('sel'));

  const btn12 = document.getElementById('pc-btn12');
  const btn23 = document.getElementById('pc-btn23');
  const btn34 = document.getElementById('pc-btn34');
  const btn45 = document.getElementById('pc-btn45');
  const btnConf = document.getElementById('pc-btn-conf');

  if (btn12) btn12.disabled = !!(S.comercio.trabajadores || []).length;
  if (btn23) btn23.disabled = true;
  if (btn34) btn34.disabled = true;
  if (btn45) btn45.disabled = true;

  if (btnConf) {
    btnConf.disabled = false;
    btnConf.innerHTML = 'Confirmar turno ✓';
  }

  ['pc-nom', 'pc-ape', 'pc-wa', 'pc-email', 'pc-coment'].forEach(id => {
    const input = document.getElementById(id);
    if (input) input.value = '';
  });

  const err = document.getElementById('pc-datos-err');
  if (err) err.textContent = '';

  const horasGrid = document.getElementById('pc-horas-grid');
  if (horasGrid) horasGrid.innerHTML = '';

  const horasLoading = document.getElementById('pc-horas-loading');
  if (horasLoading) horasLoading.style.display = 'none';

  const paso3Sub = document.getElementById('pc-paso3-sub');
  if (paso3Sub) paso3Sub.textContent = 'Turnos disponibles';

  ['pc-paso-ok', 'pc-paso6', 'pc-paso5', 'pc-paso4', 'pc-paso3', 'pc-paso2', 'pc-paso1'].forEach(id => {
    document.getElementById(id)?.classList.remove('v');
  });

  document.getElementById('pc-paso1')?.classList.add('v');

  pcRenderCalendario();
  pcActualizarSteps(1);

  document.getElementById('pc-reservas')?.scrollIntoView({ behavior: 'smooth' });
}

function pcIrPaso(n) {
  if (n === 2) pcRenderServiciosReserva();
  if (n === 4) pcCargarHoras();
  if (n === 6) pcRenderResumen();
  const ant = document.getElementById('pc-paso' + S.paso) || document.getElementById('pc-paso-ok');
  ant?.classList.remove('v');
  document.getElementById('pc-paso' + n)?.classList.add('v');
  S.paso = n;
  pcActualizarSteps(n);
  document.getElementById('pc-reservas')?.scrollIntoView({ behavior: 'smooth' });
}

function pcActualizarSteps(actual) {
  for (let i = 1; i <= 6; i++) {
    const num = document.getElementById('pcsn' + i);
    const lbl = document.getElementById('pcsl' + i);
    if (!num) continue;
    num.className = 'step-num';
    lbl.className = 'step-lbl';
    if (i < actual) { num.classList.add('done'); num.textContent = '✓'; }
    else { num.textContent = i; }
    if (i === actual) { num.classList.add('on'); lbl.classList.add('on'); }
    if (i < 6) {
      const linea = document.getElementById(`pcsl${i}${i+1}`);
      if (linea) linea.className = 'step-line' + (i < actual ? ' done' : '');
    }
  }
}

function mostrarModal(titulo, contenido, onConfirmar) {
  let overlay = document.getElementById('modal-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'modal-overlay';
    document.body.appendChild(overlay);
  }
  overlay.innerHTML = `
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem">
        <h3 style="margin:0;color:var(--oro)">${titulo}</h3>
        <button onclick="cerrarModal()" style="background:none;border:none;color:var(--texto2);font-size:1.3rem;cursor:pointer">✕</button>
      </div>
      ${contenido}
      <div style="display:flex;gap:0.75rem;justify-content:flex-end;margin-top:1.5rem">
        <button class="btn btn-ghost" onclick="cerrarModal()">Cancelar</button>
        <button class="btn btn-oro" id="modal-confirmar-btn" onclick="modalConfirmar()">Guardar</button>
      </div>
    </div>`;
  overlay.classList.add('abierto');
  overlay._onConfirmar = onConfirmar;
}

function abrirModal(titulo, contenido, onConfirmar) {
  return mostrarModal(titulo, contenido, onConfirmar);
}

async function modalConfirmar() {
  const btn = document.getElementById('modal-confirmar-btn');
  const overlay = document.getElementById('modal-overlay');
  btn.disabled = true;
  btn.innerHTML = '<span class="loader-inline"></span> Guardando...';
  try {
    const result = await overlay._onConfirmar();
    if (result === false) { btn.disabled = false; btn.innerHTML = 'Guardar'; return; }
    cerrarModal();
  } catch (e) {
    toast(e.message, 'error');
    btn.disabled = false;
    btn.innerHTML = 'Guardar';
  }
}

function cerrarModal() {
  document.getElementById('modal-overlay')?.classList.remove('abierto');
}
